name: TadaWords

options:
  bundleIdPrefix: com.tadawords
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true

packages:
  TadaWordsModules:
    path: .

targets:
  TadaWords:
    type: application
    platform: iOS
    sources:
      - path: Apps/TadaWordsApp
    dependencies:
      - package: TadaWordsModules
        product: TadaWordsAppShell
      - package: TadaWordsModules
        product: TadaWordsApplePlatform
      - package: TadaWordsModules
        product: TadaWordsDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadawords.app
        PRODUCT_NAME: Tada Words
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Apps/TadaWordsApp/TadaWords.entitlements
    info:
      path: Apps/TadaWordsApp/Info.plist
      properties:
        CFBundleDisplayName: Tada Words
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Tada Words uses the microphone only after the child taps it to check a spoken practice word. Audio is not saved.
        NSFaceIDUsageDescription: Tada Words uses Face ID to protect sensitive grown-up actions such as sharing or deleting a profile.
        NSCameraUsageDescription: Tada Words uses the camera only when a grown-up chooses to take a child profile picture.
        NSPhotoLibraryUsageDescription: Tada Words lets a grown-up choose a picture for a child profile.
        NSSpeechRecognitionUsageDescription: Tada Words uses on-device speech recognition to compare the spoken practice word and give immediate feedback.
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  TadaWords:
    build:
      targets:
        TadaWords: all
    run:
      config: Debug
    archive:
      config: Release
