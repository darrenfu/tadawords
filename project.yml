name: TadaWords

options:
  bundleIdPrefix: app.tadawords
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top

configs:
  Debug: debug
  LocalQA: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true

packages:
  TadaWordsModules:
    path: .

targets:
  TadaWords:
    type: application
    platform: iOS
    productName: Tada Words
    sources:
      - path: Apps/TadaWordsApp
        excludes:
          - InfoLocalQA.plist
    dependencies:
      - package: TadaWordsModules
        product: TadaWordsAppShell
      - package: TadaWordsModules
        product: TadaWordsApplePlatform
      - package: TadaWordsModules
        product: TadaWordsDomain
      - package: TadaWordsModules
        product: TadaWordsContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadawords.app
        PRODUCT_NAME: Tada Words
        MARKETING_VERSION: 0.7.34
        CURRENT_PROJECT_VERSION: 2026072408
        TADA_GIT_COMMIT: unknown
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Apps/TadaWordsApp/TadaWords.entitlements
      configs:
        Debug:
          DEVELOPMENT_TEAM: 7R78Q4HP86
          APP_ATTEST_ENVIRONMENT: development
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          DEVELOPMENT_TEAM: 7R78Q4HP86
          APP_ATTEST_ENVIRONMENT: production
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production
        LocalQA:
          PRODUCT_BUNDLE_IDENTIFIER: com.tadawords.app.localqa
          PRODUCT_NAME: Tada Words QA
          INFOPLIST_FILE: Apps/TadaWordsApp/InfoLocalQA.plist
          CODE_SIGN_ENTITLEMENTS: Apps/TadaWordsApp/TadaWordsLocalQA.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_DEVICE_QA"
    info:
      path: Apps/TadaWordsApp/Info.plist
      properties:
        CFBundleDisplayName: Tada Words
        CFBundleShortVersionString: "0.7.34"
        CFBundleVersion: "2026072408"
        TadaWordsGitCommit: "$(TADA_GIT_COMMIT)"
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: A parent enables microphone access for spoken Read Practice. Tada Words analyzes short recordings on device; raw audio is not saved or uploaded.
        NSFaceIDUsageDescription: Tada Words uses Face ID to protect sensitive parent actions such as sharing or deleting a profile.
        NSCameraUsageDescription: Tada Words uses the camera only when a parent chooses a profile photo or scans a word sheet for on-device text recognition.
        NSPhotoLibraryUsageDescription: Tada Words lets a parent choose a profile photo or a word-sheet photo for on-device text recognition.
        NSSpeechRecognitionUsageDescription: A parent enables on-device speech recognition so Tada Words can compare a spoken practice word and give immediate feedback.
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  TadaWordsDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TadaWordsDeviceTests
    dependencies:
      - target: TadaWords
      - package: TadaWordsModules
        product: TadaWordsApplePlatform
      - package: TadaWordsModules
        product: TadaWordsDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadawords.app.devicetests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tada Words.app/Tada Words"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        LocalQA:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tada Words QA.app/Tada Words QA"

  TadaWordsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TadaWordsUITests
        excludes:
          - README.md
    dependencies:
      - target: TadaWords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadawords.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TadaWords
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.tadawords.app.uitests
          DEVELOPMENT_TEAM: 7R78Q4HP86
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.tadawords.app.uitests
          DEVELOPMENT_TEAM: 7R78Q4HP86

  TadaWordsPhotoEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TadaWordsGuardianFeaturesTests/GuardianPhotoEditorTests.swift
    dependencies:
      - package: TadaWordsModules
        product: TadaWordsGuardianFeatures
      - package: TadaWordsModules
        product: TadaWordsDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tadawords.photo-editor-tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  TadaWords:
    build:
      targets:
        TadaWords: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TadaWordsUITests
    archive:
      config: Release
  TadaWordsLocalQA:
    build:
      targets:
        TadaWords: all
    run:
      config: LocalQA
    test:
      config: LocalQA
    profile:
      config: LocalQA
    analyze:
      config: LocalQA
    archive:
      config: LocalQA
  TadaWordsDeviceTests:
    build:
      targets:
        TadaWords: [test]
        TadaWordsDeviceTests: [test]
    test:
      config: LocalQA
      targets:
        - name: TadaWordsDeviceTests
  TadaWordsPhotoEditorTests:
    build:
      targets:
        TadaWordsPhotoEditorTests: [test]
    test:
      config: Debug
      targets:
        - name: TadaWordsPhotoEditorTests
